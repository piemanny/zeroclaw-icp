[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
ic-cdk = "0.20"
ic-cdk-timers = "1.0"
ic-cdk-management-canister = "0.1"
ic-stable-structures = "0.7"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
strip = true